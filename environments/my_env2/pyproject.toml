[project]
name = "my_env2"
version = "0.1.0"
description = "Automatically authored multi-step tool-use tasks over a mock chat app."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_env2"]
