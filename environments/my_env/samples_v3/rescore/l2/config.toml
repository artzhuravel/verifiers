model = "openai/gpt-5-nano"
num_rollouts = 1
shuffle = false
max_concurrent = 128
verbose = false
rich = false
server = false
push = false
output_dir = "environments/my_env/samples_v3/rescore/l2"

[env]
id = ""

[env.taskset]
id = "my_env"
dataset = "environments/my_env/samples_v3/authored_tasks_l2.jsonl"
num_generated = 5
timesteps = 3
max_actions_per_t = 3
p_invalid = 0.2
p_open = 0.15

[env.taskset.task]
judges = []

[env.taskset.task.tools]
colocated = false

[env.taskset.task.tools.runtime]
type = "subprocess"

[env.taskset.task.web]
colocated = false
url = "https://mcp.deepwiki.com/mcp"

[env.taskset.task.web.runtime]
type = "subprocess"

[env.taskset.task.judge]
base_url = "https://openrouter.ai/api/v1"
api_key_var = "OPENROUTER_API_KEY"
id = ""
name = ""
weight = 1.0
model = "openai/gpt-5-mini"

[env.taskset.task.judge.headers]

[env.taskset.task.judge.sampling]

[env.timeout]

[env.retries]
max_retries = 0
include = []
exclude = []

[env.interception]
type = "elastic"
multiplex = 32

[env.agent.harness]
id = "null"
forward_env = []
skills = []

[env.agent.harness.env]

[env.agent.runtime]
type = "subprocess"

[env.agent.timeout]

[env.agent.retries]
max_retries = 0
include = []
exclude = []

[pool]
type = "elastic"
multiplex = 128

[args]

[extra_env_kwargs]

[client]
base_url = "https://openrouter.ai/api/v1"
api_key_var = "OPENROUTER_API_KEY"
type = "eval"

[client.headers]

[sampling]
